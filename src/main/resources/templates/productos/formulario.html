<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${esNuevo} ? 'Nuevo Producto' : 'Editar Producto'">Formulario Producto</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <div class="container">
		
		
		
        <h1 th:text="${esNuevo} ? 'Crear Nuevo Producto' : 'Editar Producto'">Formulario</h1>
        <form th:action="${esNuevo} ? @{/vistas/productos} : @{/vistas/productos/{id}(id=${id})}"
	          th:method="post"
	          th:object="${producto}">
            <input type="hidden" th:field="*{id}" />
            <!-- Para actualización, necesitamos el método PUT -->            
            <div class="form-group">
                <label for="productName">Nombre del Producto:</label>
                <input type="text" id="productName" th:field="*{productName}" required/>
            </div>
            
            <div class="form-group">
                <label for="productKey">Clave del Producto:</label>
                <input type="text" id="productKey" th:field="*{productKey}" required/>
            </div>
            
            <div class="form-group">
                <label for="price">Precio:</label>
                <input type="number" id="price" th:field="*{price}" step="0.01" required/>
            </div>
            
            <div class="form-group">
                <label for="minPrice">Precio Mínimo:</label>
                <input type="number" id="minPrice" th:field="*{minPrice}" step="0.01" required/>
            </div>
            
            <div class="form-group">
                <label for="maxPrice">Precio Máximo:</label>
                <input type="number" id="maxPrice" th:field="*{maxPrice}" step="0.01" required/>
            </div>
            
            <div class="form-group">
                <button type="submit">💾 Guardar</button>
                <a href="/vistas/productos" class="cancelar" style="padding:10px 20px; text-decoration:none;">❌ Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
